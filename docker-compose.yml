name: lexcyber-v03

services:
  web:
    build:
      context: ./web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    depends_on: [java]
    expose: [80]

  java:
    build:
      context: ./server
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/lexcyber
      DATABASE_USER: lex_app
      DATABASE_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration/app
      SPRING_FLYWAY_SCHEMAS: app
      SPRING_FLYWAY_DEFAULT_SCHEMA: app
      ENGINE_BASE_URL: http://engine:8100
      ENGINE_SERVICE_TOKEN: ${ENGINE_SERVICE_TOKEN:?ENGINE_SERVICE_TOKEN is required}
      REVIEW_AUTH_MODE: trusted-header
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: lexcyber
      MODEL_CONFIG_ENCRYPTION_KEY: ${MODEL_CONFIG_ENCRYPTION_KEY:-}
      SENTENCING_ENABLED: ${SENTENCING_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      engine-migrate:
        condition: service_completed_successfully
      engine:
        condition: service_healthy
      minio:
        condition: service_started
    expose: [8080]

  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    command: ["uvicorn", "engine.run_api_v03:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      ENGINE_DATABASE_URL: postgresql://lex_engine:${ENGINE_DB_PASSWORD:?ENGINE_DB_PASSWORD is required}@postgres:5432/lexcyber
      REDIS_URL: redis://redis:6379/0
      SERVICE_TOKEN: ${ENGINE_SERVICE_TOKEN:?ENGINE_SERVICE_TOKEN is required}
      APP_CALLBACK_BASE_URL: http://java:8080
      WORKFLOW_PROFILE: ${WORKFLOW_PROFILE:-stub}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-stub}
      MODEL_NAME: ${MODEL_NAME:-stub-general-v1}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_API_BASE_URL: ${MODEL_API_BASE_URL:-https://api.openai.com/v1}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-45}
      KNOWLEDGE_BASE_URL: ${KNOWLEDGE_BASE_URL:-}
      LEGAL_SOURCE_SEARCH_ENABLED: ${LEGAL_SOURCE_SEARCH_ENABLED:-false}
      SENTENCING_ENABLED: ${SENTENCING_ENABLED:-false}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: lexcyber
    depends_on:
      engine-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    expose: [8100]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  engine-worker:
    build:
      context: .
      dockerfile: engine/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    command: ["dramatiq", "engine.run_api_v03", "--processes", "1", "--threads", "4"]
    environment:
      ENGINE_DATABASE_URL: postgresql://lex_engine:${ENGINE_DB_PASSWORD:?ENGINE_DB_PASSWORD is required}@postgres:5432/lexcyber
      REDIS_URL: redis://redis:6379/0
      SERVICE_TOKEN: ${ENGINE_SERVICE_TOKEN:?ENGINE_SERVICE_TOKEN is required}
      APP_CALLBACK_BASE_URL: http://java:8080
      WORKFLOW_PROFILE: ${WORKFLOW_PROFILE:-stub}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-stub}
      MODEL_NAME: ${MODEL_NAME:-stub-general-v1}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_API_BASE_URL: ${MODEL_API_BASE_URL:-https://api.openai.com/v1}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-45}
      KNOWLEDGE_BASE_URL: ${KNOWLEDGE_BASE_URL:-}
      LEGAL_SOURCE_SEARCH_ENABLED: ${LEGAL_SOURCE_SEARCH_ENABLED:-false}
      SENTENCING_ENABLED: ${SENTENCING_ENABLED:-false}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: lexcyber
    depends_on:
      engine:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  engine-migrate:
    image: flyway/flyway:10.20.1-alpine
    command: ["migrate", "-url=jdbc:postgresql://postgres:5432/lexcyber", "-user=lex_engine", "-password=${ENGINE_DB_PASSWORD:?ENGINE_DB_PASSWORD is required}", "-schemas=engine", "-locations=filesystem:/flyway/sql"]
    volumes:
      - ./engine/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: lex_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: lexcyber
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      ENGINE_DB_PASSWORD: ${ENGINE_DB_PASSWORD:?ENGINE_DB_PASSWORD is required}
    volumes:
      - postgres_v03:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lex_migrator -d lexcyber"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_v03:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes: [minio_v03:/data]

  nginx:
    image: nginx:1.27.2-alpine
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      - ./nginx/nginx.v03.conf:/etc/nginx/nginx.conf:ro
    depends_on: [web, java]

volumes:
  postgres_v03:
  redis_v03:
  minio_v03:
