<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网域衡鉴 LexCyber · 人工智能大赛校赛版</title><style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#203047;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}header{background:#102841;color:#fff;padding:20px clamp(16px,4vw,60px)}header h1{margin:0;font-size:26px}header p{margin:6px 0 0;color:#c2d2e5}main{max-width:1160px;margin:auto;padding:22px 16px 64px}.banner{background:#e5f5ed;color:#1b624e;padding:12px 16px;border-radius:9px;margin-bottom:15px}.grid{display:grid;grid-template-columns:245px 1fr;gap:18px}.card{background:white;border:1px solid #dae2eb;border-radius:13px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px #20304708}h2{font-size:19px;margin:0 0 13px}h3{font-size:15px;margin:12px 0 7px}.small{color:#67798a;font-size:13px}.case{width:100%;padding:14px;text-align:left;border:1px solid #dae2eb;border-radius:8px;background:#fff;margin-bottom:8px;cursor:pointer}.case.active{border:2px solid #1c7d76;background:#ecf8f5}button{cursor:pointer;border:0;border-radius:7px;background:#155c73;color:white;padding:9px 13px;font-weight:600}button:disabled{opacity:.5;cursor:not-allowed}.subtle{background:#e7eef4;color:#24455b}.danger{background:#fbe8e7;color:#9f322e}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}input,select,textarea{max-width:100%;padding:8px;border:1px solid #b9c7d4;border-radius:6px;font:inherit}input[type=number]{width:160px}textarea{width:100%;min-height:62px}.line{padding:9px 0;border-bottom:1px solid #eff2f5}.line:last-child{border:0}.pill{font-size:11px;border-radius:99px;padding:3px 9px;background:#e8edf2;color:#314e61}.ok{background:#dff4e5;color:#226b44}.warn{background:#fff0d7;color:#82571b}.bad{background:#ffe5e1;color:#933d37}.result{border:1px solid #e0e8ee;border-radius:8px;padding:12px;margin:8px 0}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.stat div{background:#f2f7fa;border-radius:8px;padding:11px}.stat strong{display:block;font-size:19px}.tabs button{background:#e4ebf0;color:#1a445b}.tabs button.active{background:#155c73;color:#fff}.muted{opacity:.72}.notice{font-size:12px;color:#8b5a22;background:#fff5e2;border-radius:7px;padding:9px}.hide{display:none}@media(max-width:720px){.grid{grid-template-columns:1fr}.stat{grid-template-columns:1fr 1fr}header h1{font-size:20px}}</style></head><body><header><h1>网域衡鉴 LexCyber</h1><p>人工智能大赛校赛版 · 金融合规与风险辅助研判 · 可信可审计工作台</p></header><main><div class="banner">合成数据演示 · 内部演示规则不代表监管阈值 · 系统只提供人工复核参考，不作欺诈、违法或最终合规认定。</div><div class="grid"><aside><section class="card"><h2>演示事项</h2><div id="case-list"></div><button class="subtle" id="reset">重置合成案例</button></section><section class="card"><h2>工作流</h2><p class="small">资料 → 事实确认 → 规则解释 → 人工复核 → 报告 → 归档记录</p><p class="small" id="storage"></p></section></aside><article><section class="card"><h2 id="case-title"></h2><div class="stat" id="stats"></div><div class="row tabs" id="tabs"><button data-tab="facts">事实核验</button><button data-tab="rules">规则分析</button><button data-tab="review">人工复核</button><button data-tab="report">审查报告</button><button data-tab="agent">Agent 解释</button></div></section><div id="pane"></div></article></div></main>
<script>
let state=null,caseId="F1",tab="facts";const $=s=>document.querySelector(s);const el=(tag,txt,cls)=>{const x=document.createElement(tag);if(txt!==undefined)x.textContent=String(txt);if(cls)x.className=cls;return x};const safe=(v)=>typeof v==="boolean"?(v?"是 / true":"否 / false"):String(v);
const names={beneficial_owner_verified:"实际控制人已核验",business_purpose_verified:"业务用途已核验",source_of_funds_verified:"资金来源已核验",supporting_documents_complete:"材料完整",account_age_days:"账户存续天数",transaction_frequency_24h:"24 小时交易次数",transaction_total_30d:"30 日交易聚合金额（演示元）",cross_border_transaction:"包含跨境交易标记",high_risk_region:"涉及风险地区标记"};
async function get(url){const r=await fetch(url);const d=await r.json();if(!r.ok)throw Error(d.error||"请求失败");return d}
async function post(action){try{const r=await fetch("/api/action",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...action,caseId})});const d=await r.json();if(!r.ok)throw Error(d.error||"操作失败");await load()}catch(e){alert(e.message)}}
function caseNow(){return state.cases.find(x=>x.id===caseId)}
async function load(){state=await get("/api/state");render()}
function render(){const c=caseNow(),v=c.versions.at(-1),a=c.artifacts.at(-1);$("#case-title").textContent=c.id+" · "+c.title;$("#storage").textContent="存储模式："+(window.storageMode||"加载中");$("#case-list").replaceChildren(...state.cases.map(x=>{const b=el("button",x.id+" · "+x.title,"case"+(x.id===caseId?" active":""));b.onclick=()=>{caseId=x.id;tab="facts";render()};return b}));$("#stats").replaceChildren(...[["事实版本",v?.id||"未确认"],["当前结果",a?(a.stale?"已失效":a.id):"未执行"],["人工复核",c.reviews.length+" 条"]].map(([k,v])=>{const b=el("div");b.append(el("span",k,"small"),el("strong",v));return b}));$("#tabs").querySelectorAll("button").forEach(b=>{b.classList.toggle("active",b.dataset.tab===tab);b.onclick=()=>{tab=b.dataset.tab;render()}});const p=$("#pane");p.replaceChildren();if(tab==="facts")renderFacts(p,c,v);else if(tab==="rules")renderRules(p,c,a);else if(tab==="review")renderReview(p,c,a);else if(tab==="report")renderReport(p,c,a,v);else renderAgent(p,c)}
function card(parent,title){const x=el("section",undefined,"card");x.append(el("h2",title));parent.append(x);return x}
function renderFacts(p,c,v){const box=card(p,"合成材料与待确认事实");c.documents.forEach(d=>box.append(el("p",d.name+" · "+d.locator+" · "+d.note,"small")));const tip=el("p","修改工作副本不会立即影响分析；点击确认后才生成不可变 FactsVersion，并让既有 Artifact 失效。","notice");box.append(tip);Object.entries(c.draft).forEach(([k,value])=>{const row=el("div",undefined,"row line");const label=el("label",names[k]||k,"grow");let inp;if(typeof value==="boolean"){inp=el("select");for(const [val,title] of [["true","是"],["false","否"]]){const o=el("option",title);o.value=val;inp.append(o)}inp.value=String(value)}else {inp=el("input");inp.type="number";inp.min="0";inp.value=value}const b=el("button","保存工作副本","subtle");b.onclick=()=>post({type:"edit",field:k,value:typeof value==="boolean"?inp.value==="true":Number(inp.value)});row.append(label,inp,b);box.append(row)});const bt=el("button","确认当前事实 → 创建 FactsVersion");bt.onclick=()=>{if(confirm("将创建新的不可变事实快照，并使旧结果失效。继续？"))post({type:"confirm"})};box.append(bt);if(v)box.append(el("p","当前确认版本："+v.id+" · "+v.confirmedAt,"small"));const history=card(p,"事实版本历史");if(!c.versions.length)history.append(el("p","尚无版本","small"));c.versions.forEach(x=>history.append(el("div",x.id+" · "+x.confirmedAt,"line small")))}
function renderRules(p,c,a){const box=card(p,"规则分析与条件 Trace");const b=el("button","基于最新确认事实运行演示规则");b.disabled=!c.versions.length;b.onclick=()=>post({type:"run"});box.append(b,el("p","规则来源为校赛合成演示策略，不对应正式机构合规批准。","notice"));if(!a){box.append(el("p","尚无分析。请先确认事实，再运行演示规则。","small"));return}box.append(el("p","Artifact "+a.id+" · 事实依赖 "+a.factsVersionId+(a.stale?" · 已失效，需重新执行":" · 当前版本"),"small"));a.results.forEach(r=>{const x=el("div",undefined,"result");x.append(el("strong",r.ruleId+" · "+r.label));x.append(el("span",r.status==="blocked"?"输入阻断":r.fired?"触发复核提示":"未触发", "pill "+(r.status==="blocked"?"bad":r.fired?"warn":"ok")));x.append(el("p",r.source+" · "+(r.action||r.blocker||"无动作"),"small"));const detail=el("details");detail.append(el("summary","查看输入及逐条件 Trace"),el("pre",JSON.stringify(r.trace,null,2)));x.append(detail);box.append(x)})}
function renderReview(p,c,a){const box=card(p,"人工复核");if(!a){box.append(el("p","先生成分析结果。"));return}box.append(el("p","绑定结果版本："+a.id+(a.stale?"（已失效）":""),"small"));const txt=el("textarea");txt.placeholder="复核意见（不超过 1000 字）";box.append(txt);const row=el("div",undefined,"row");for(const [decision,title] of [["approved","批准演示结果"],["rejected","退回演示结果"]]){const b=el("button",title,decision==="rejected"?"subtle":"");b.disabled=a.stale;b.onclick=()=>post({type:"review",decision,comment:txt.value});row.append(b)}box.append(row);const history=card(p,"复核历史");c.reviews.forEach(x=>history.append(el("p",x.at+" · "+x.artifactId+" · "+x.decision+" · "+x.comment,"line small")))}
function renderReport(p,c,a,v){const box=card(p,"合规审查辅助报告");if(!a||!v){box.append(el("p","先完成事实确认与规则执行。"));return}const approved=c.reviews.some(r=>r.artifactId===a.id&&r.decision==="approved");box.append(el("p","当前状态："+(a.stale?"原结果已失效":approved?"已有对应人工复核批准":"待人工复核"),a.stale?"notice":"small"));const data=el("div");data.append(el("h3",c.id+" · "+c.title),el("p","事实版本："+a.factsVersionId+"；结果版本："+a.id));data.append(el("h3","已确认事实"));Object.entries(v.facts).forEach(([k,x])=>data.append(el("p",(names[k]||k)+"："+safe(x),"small")));data.append(el("h3","演示规则结果"));a.results.forEach(r=>data.append(el("p",r.ruleId+"："+(r.status==="blocked"?"阻断":r.fired?"需要人工复核":"未触发"),"small")));data.append(el("p","仅供合成案例演示；不得用于真实客户决策或违法认定。","notice"));box.append(data);const print=el("button","打印 / 另存 PDF","subtle");print.onclick=()=>window.print();box.append(print);const archive=card(p,"审计记录（演示）");c.events.forEach(e=>archive.append(el("div",e.at+" · "+e.type+" · "+(e.artifactId||"facts-v"+e.version),"line small")))}
async function renderAgent(p,c){const box=card(p,"案件解释型 Agent（固定问题、无外部模型）");box.append(el("p","回答仅根据当前事实与已存储规则结果组合，不能生成新认定。","notice"));const answers=el("div");for(const [q,title] of [["rules","本次触发了哪些规则？"],["review","为什么需要人工复核？"],["change","事实变化后旧结果还能使用吗？"]]){const b=el("button",title,"subtle");b.style.margin="4px";b.onclick=async()=>{try{const d=await get("/api/explain?caseId="+encodeURIComponent(c.id)+"&question="+q);answers.replaceChildren(el("p",d.answer),el("p","来源："+d.citations.join(" · "),"small"))}catch(e){alert(e.message)}};box.append(b)}box.append(answers)}
$("#reset").onclick=()=>{if(confirm("重置全部合成案例及演示复核记录？"))post({type:"reset"})};get("/healthz").then(x=>{window.storageMode=x.storage;load()}).catch(e=>alert(e.message));
</script></body></html>
