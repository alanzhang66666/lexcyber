name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Boundary guard
        run: |
          if grep -rEn '^\s*(from|import)\s+(apps|domain)\b' engine models graph skill_runtime skills retrieval; then
            echo "::error::engine-side packages must not import the removed 0.2 apps/domain packages"
            exit 1
          fi
      - name: Test
        run: pytest -q -m "not integration"
      - name: Compose config
        env:
          POSTGRES_PASSWORD: ci-postgres
          APP_DB_PASSWORD: ci-app
          ENGINE_DB_PASSWORD: ci-engine
          ENGINE_SERVICE_TOKEN: ci-engine-token
          MINIO_ROOT_USER: ci-minio
          MINIO_ROOT_PASSWORD: ci-minio-password
        run: docker compose -f docker-compose.yml config --quiet

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and test
        working-directory: server
        run: mvn -B test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: pip install "openapi-spec-validator>=0.7,<1"
      - name: Validate contracts
        run: |
          openapi-spec-validator contracts/public-api.yaml
          openapi-spec-validator contracts/public-api-v2.yaml
          openapi-spec-validator contracts/internal-engine-api.yaml
          python scripts/check_openapi_snapshot.py

  compose-e2e:
    runs-on: ubuntu-latest
    needs: [test, java, web, contracts]
    env:
      POSTGRES_PASSWORD: ci-postgres
      APP_DB_PASSWORD: ci-app
      ENGINE_DB_PASSWORD: ci-engine
      ENGINE_SERVICE_TOKEN: ci-engine-token
      MINIO_ROOT_USER: ci-minio
      MINIO_ROOT_PASSWORD: ci-minio-password
    steps:
      - uses: actions/checkout@v4
      - name: Start 0.8 stack
        run: docker compose -f docker-compose.yml up -d --build
      - name: Exercise document storage and full v2 lifecycle
        run: python3 scripts/ci_compose_smoke.py --with-lifecycle
      - name: Verify concurrent confirmation, publication and archive
        run: |
          docker compose -f docker-compose.yml exec -T engine python - \
            --base-url http://nginx:8080 --engine-url http://engine:8100 \
            --java-url http://java:8080 --require-all < scripts/concurrency_check.py
      - name: Verify registry constraints against migrated engine database
        run: |
          docker compose -f docker-compose.yml run --rm --no-deps \
            -e LEXCYBER_REQUIRE_INTEGRATION_DB=1 \
            -v "$PWD/tests/integration:/tmp/registry-tests:ro" \
            engine sh -c 'python -m pip install "pytest>=8,<9" && python -m pytest -q /tmp/registry-tests/test_rule_registry.py /tmp/registry-tests/test_registry_review_gates.py'
      - if: always()
        run: docker compose -f docker-compose.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.yml down -v
