  <rect x="17" y="17" width="38" height="38" rx="9" fill="#2F6FED"/>
  <text class="t white" x="36" y="43" font-size="18" text-anchor="middle" font-weight="800">L</text>
  <path d="M26 108h20v17H26zM30 104h12l4 4" fill="none" stroke="#8FA0B8" stroke-width="2"/>
  <circle cx="36" cy="184" r="10" fill="none" stroke="#8FA0B8" stroke-width="2"/>
  <path d="M31 184l4 4 7-9" fill="none" stroke="#8FA0B8" stroke-width="2"/>
  <rect x="12" y="228" width="48" height="48" rx="10" fill="#2B3E58"/>
  <path d="M36 240v22M26 246h20M31 246l-6 9h12zM43 246l-6 9h12z" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M27 309h18v19H27zM30 314h12M30 319h9" fill="none" stroke="#8FA0B8" stroke-width="2"/>
  <circle cx="36" cy="950" r="18" fill="#354963"/>
  <text class="t white" x="36" y="956" font-size="14" text-anchor="middle">审</text>

