  <rect x="1445" y="18" width="123" height="40" rx="8" fill="#FFFFFF" stroke="#D5DDE7"/>
  <text class="t small" x="1507" y="43" text-anchor="middle">历史版本 ▾</text>

  <!-- Legal warning -->
  <rect x="96" y="94" width="1472" height="52" rx="8" fill="#FFF8E7" stroke="#E9C87D"/>
  <circle cx="120" cy="120" r="10" fill="#D98919"/>
  <text class="t white tiny" x="120" y="124" text-anchor="middle">!</text>
  <text class="t small" x="140" y="117" font-weight="700">辅助分析，不替代司法裁量</text>
