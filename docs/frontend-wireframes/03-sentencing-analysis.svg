  <rect x="1036" y="618" width="70" height="30" rx="6" fill="#FFF0BD"/>
  <text class="t tiny" x="1071" y="638" text-anchor="middle" fill="#A66008">待确认</text>

  <rect x="514" y="665" width="609" height="50" rx="7" fill="#FFF9EC"/>
  <circle cx="534" cy="690" r="7" fill="#D98919"/>
  <text class="t small" x="550" y="695" font-weight="700">取得谅解</text>
  <text class="t tiny muted" x="641" y="695">证据 1 项 · 建议区间 -5% ～ -15%</text>
  <rect x="948" y="675" width="78" height="30" rx="6" fill="#FFFFFF" stroke="#D6B66E"/>
  <text class="t small" x="987" y="695" text-anchor="middle">-10%</text>
  <rect x="1036" y="675" width="70" height="30" rx="6" fill="#FFF0BD"/>
  <text class="t tiny" x="1071" y="695" text-anchor="middle" fill="#A66008">待确认</text>

  <text class="t tiny" x="514" y="742" fill="#2F6FED">＋ 添加或排除量刑情节</text>
  <text class="t tiny muted" x="1123" y="742" text-anchor="end">当前合计调节：-40%</text>

