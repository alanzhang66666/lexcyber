  <text class="t muted tiny" x="744" y="275" text-anchor="middle">沪检刑诉〔2026〕128号</text>

  <text class="t small" x="502" y="319">被告人：</text>
  <rect x="570" y="301" width="72" height="24" rx="3" fill="#DCEAFF"/>
  <text class="t small" x="578" y="319" font-weight="700">张某，男</text>
  <text class="t small" x="644" y="319">，1992年出生，户籍地上海市……</text>
  <circle cx="1011" cy="312" r="10" fill="#2F6FED"/>
  <text class="t white tiny" x="1011" y="316" text-anchor="middle">1</text>

  <text class="t small" x="502" y="357">经依法审查查明：</text>
  <text class="t small" x="502" y="394">2026年3月12日，被告人进入某商场，取走柜台内财物。</text>
  <rect x="502" y="408" width="383" height="25" rx="3" fill="#FFF0BD"/>
  <text class="t small" x="510" y="426">经价格认定，被盗财物价值人民币38,000元。</text>
  <circle cx="1011" cy="420" r="10" fill="#D98919"/>
  <text class="t white tiny" x="1011" y="424" text-anchor="middle">2</text>

  <text class="t small" x="502" y="466">案发后，被告人于2026年3月18日主动到案并如实供述。</text>
  <rect x="502" y="480" width="341" height="25" rx="3" fill="#DFF5EB"/>
  <text class="t small" x="510" y="498">涉案财物已追回，被告人取得被害人谅解。</text>
  <circle cx="1011" cy="492" r="10" fill="#2E9B72"/>
  <text class="t white tiny" x="1011" y="496" text-anchor="middle">3</text>

  <text class="t small" x="502" y="538">认定上述事实的证据如下：</text>
  <text class="t small" x="518" y="572">1. 被告人供述与辩解；</text>
  <text class="t small" x="518" y="602">2. 被害人陈述及辨认笔录；</text>
  <text class="t small" x="518" y="632">3. 价格认定意见、监控录像及转账记录。</text>

  <text class="t small" x="502" y="684">本院认为，被告人的行为应结合相关事实和证据依法审查。</text>
  <rect x="502" y="698" width="308" height="25" rx="3" fill="#E9E2FF"/>
  <text class="t small" x="510" y="716">依据《中华人民共和国刑法》相关规定</text>
  <text class="t small" x="812" y="716">，提起公诉。</text>
