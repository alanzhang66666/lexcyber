spring:
  application:
    name: lexcyber-java
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
    locations: ${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}
server:
  port: ${SERVER_PORT:8080}
engine:
  base-url: ${ENGINE_BASE_URL:http://engine:8100}
  service-token: ${ENGINE_SERVICE_TOKEN}
review:
  auth-mode: ${REVIEW_AUTH_MODE:disabled}
management:
  endpoints:
    web:
      exposure:
        include: health,info
