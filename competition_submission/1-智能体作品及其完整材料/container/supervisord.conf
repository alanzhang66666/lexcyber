[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/lexcyber-supervisord.pid

[unix_http_server]
file=/run/lexcyber-supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/lexcyber-supervisor.sock

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --dir /data/redis --appendonly yes
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:engine-api]
command=/opt/lexcyber/venv/bin/uvicorn engine.run_api_v03:app --host 127.0.0.1 --port 8100
directory=/opt/lexcyber
environment=PYTHONPATH="/opt/lexcyber/src",KNOWLEDGE_ROOT="/opt/lexcyber/knowledge"
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:engine-worker]
command=/opt/lexcyber/venv/bin/dramatiq engine.run_api_v03 --processes 1 --threads 2
directory=/opt/lexcyber
environment=PYTHONPATH="/opt/lexcyber/src",KNOWLEDGE_ROOT="/opt/lexcyber/knowledge"
priority=30
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:java]
command=/usr/bin/java -jar /opt/lexcyber/server.jar
directory=/opt/lexcyber
priority=40
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=50
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
