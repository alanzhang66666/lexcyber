[project]
name = "lex-multi-agent-backend"
version = "0.1.0"
description = "Extensible multi-agent backend skeleton for Lex Cyber"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34,<2",
  "dramatiq[redis]>=1.17,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "redis>=5,<6",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
