[project]
name = "lex-multi-agent-backend"
version = "0.2.0"
description = "Extensible multi-agent backend with legal skill runtime for Lex Cyber"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34,<2",
  "dramatiq[redis]>=1.17,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "langgraph>=0.2,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pypdf>=5,<6",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "redis>=5,<6",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: tests that require postgres or other infrastructure",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = [
  "apps*",
  "agents*",
  "audit*",
  "config*",
  "domain*",
  "graph*",
  "models*",
  "prompts*",
  "retrieval*",
  "skill_runtime*",
  "skills*",
  "storage*",
  "tools*",
]

