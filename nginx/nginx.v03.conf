events {}

http {
  upstream lexcyber_web { server web:80; }
  upstream lexcyber_java { server java:8080; }

  server {
    listen 8080;
    server_name _;
    client_max_body_size 50m;

    location = /healthz {
      proxy_pass http://lexcyber_java/healthz;
      proxy_set_header X-Request-Id $request_id;
    }

    location /v1/ {
      proxy_pass http://lexcyber_java;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Reviewer-Id local-reviewer;
    }

    location / {
      proxy_pass http://lexcyber_web;
      proxy_set_header Host $host;
    }
  }
}
